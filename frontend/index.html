<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ARC ERP - frontend base" />
    <script>
      (function () {
        var salvo = localStorage.getItem('arc-tema');
        var tema = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (tema === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
    <title>ARC ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
